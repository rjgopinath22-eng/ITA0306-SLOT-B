[Config PerfEval]
network = MultiCellHandover
sim-time-limit = 60s
repeat = 5
**.numUe = ${numUe=10,20,40}
*.ue[*].mobility.typename = "LinearMobility"
*.ue[*].mobility.speed = 3mps
**.enableHandover = true
*.server.numApps = 1
*.server.app[0].typename = "UdpBasicApp"
*.server.app[0].destAddresses = "ue[0]"
*.server.app[0].destPort = 1000
*.server.app[0].messageLength = 1000B
*.server.app[0].sendInterval = 10ms
*.ue[*].numApps = 1
*.ue[*].app[0].typename = "UdpSink"
*.ue[*].app[0].localPort = 1000
