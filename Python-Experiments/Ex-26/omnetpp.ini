[General]
network = CaptureNet
sim-time-limit = 20s
*.client.numApps = 2
*.client.app[0].typename = "PingApp"
*.client.app[0].destAddr = "server"
*.client.app[0].startTime = 1s
*.client.app[1].typename = "UdpBasicApp"
*.client.app[1].destAddresses = "server"
*.client.app[1].destPort = 1000
*.client.app[1].messageLength = 800B
*.client.app[1].sendInterval = 100ms
*.client.app[1].startTime = 2s
*.server.numApps = 1
*.server.app[0].typename = "UdpSink"
*.server.app[0].localPort = 1000
*.router.numPcapRecorders = 1
*.router.pcapRecorder[0].pcapFile = "results/capture.pcap"
*.router.pcapRecorder[0].moduleNamePatterns = "eth[*]"
